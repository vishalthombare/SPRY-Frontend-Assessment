<div class="date-picker">
  <button
    class="date-trigger"
    type="button"
    [class.has-value]="hasValue"
    [attr.aria-label]="ariaLabel"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="5" width="18" height="16" rx="2"></rect>
      <path d="M16 3v4M8 3v4M3 10h18"></path>
    </svg>
    <span>{{ displayValue }}</span>
    <i aria-hidden="true"
      ><svg viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"></path></svg
    ></i>
  </button>

  @if (open()) {
    <section class="calendar" role="dialog" aria-label="Choose due date">
      <header>
        <button
          type="button"
          aria-label="Previous month"
          [disabled]="!canGoPrevious"
          (click)="changeMonth(-1)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <strong>{{ monthLabel }}</strong>
        <button type="button" aria-label="Next month" (click)="changeMonth(1)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </header>
      <div class="weekdays" aria-hidden="true">
        @for (weekday of weekdays; track weekday) {
          <span>{{ weekday }}</span>
        }
      </div>
      <div class="days">
        @for (day of days(); track day.value) {
          <button
            type="button"
            [class.other-month]="!day.currentMonth"
            [class.today]="day.today"
            [class.selected]="day.selected"
            [disabled]="day.disabled"
            [attr.aria-label]="day.value"
            [attr.aria-pressed]="day.selected"
            (click)="select(day)"
          >
            {{ day.number }}
          </button>
        }
      </div>
      <footer>
        <span>Dates before today are unavailable</span>
        <button type="button" (click)="selectToday()">Today</button>
      </footer>
    </section>
  }
</div>
