<article class="task-row">
  <button
    class="status-check"
    type="button"
    [class.checked]="task.status === 'completed'"
    [disabled]="task.status === 'completed'"
    [attr.aria-label]="task.status === 'completed' ? 'Task completed' : 'Complete task'"
    (click)="complete.emit(task)"
  >
    {{ task.status === 'completed' ? '✓' : '' }}
  </button>
  <div class="task-copy">
    <div class="task-title">
      <strong>{{ task.title }}</strong
      ><span class="status status--{{ task.status }}">{{ statusLabel }}</span>
    </div>
    <p>{{ task.description }}</p>
    <small>▦&nbsp; Due {{ task.dueDate | date: 'MMM d, y' : 'UTC' }}</small>
  </div>
  <div class="actions">
    @if (completedView) {
      <button class="restore" type="button" (click)="restore.emit(task)">↻ Restore</button>
    } @else if (task.status !== 'completed') {
      <button class="complete" type="button" (click)="complete.emit(task)">✓ Complete</button>
    }
    <button type="button" aria-label="Edit task" (click)="edit.emit(task)">✎</button
    ><button type="button" aria-label="Delete task" (click)="remove.emit(task)">♜</button>
  </div>
</article>
