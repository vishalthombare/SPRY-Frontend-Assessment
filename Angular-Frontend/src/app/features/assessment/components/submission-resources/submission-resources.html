<section class="resources" id="submission-resources">
  <header>
    <div>
      <span class="section-label">Review resources</span>
      <h2>Submission Resources</h2>
      <p>Everything needed to evaluate the implementation in one place.</p>
    </div>
    <span>3 of 3 available</span>
  </header>
  <div class="resource-grid">
    @for (resource of resources; track resource.url) {
      <article>
        <span class="icon" aria-hidden="true">↗</span>
        <div>
          <small>{{ resource.label }}</small>
          <h3>{{ resource.title }}</h3>
          <p>{{ resource.description }}</p>
        </div>
        <a
          class="resource-action"
          [href]="resource.url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="resource.action + ': ' + resource.title + ' (opens in a new tab)'"
          >{{ resource.action }} <span aria-hidden="true">↗</span></a
        >
      </article>
    }
  </div>
</section>
