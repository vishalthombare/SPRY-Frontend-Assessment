<div class="app-shell" [class.menu-open]="menuOpen()">
  <button class="sidebar-backdrop" aria-label="Close navigation" (click)="closeMenu()"></button>
  <aside class="sidebar" aria-label="Assessment navigation">
    <div class="sidebar-brand">
      <a routerLink="/assessment" (click)="closeMenu()"
        ><span class="wordmark">SPRY</span><span class="brand-label">Assessment</span></a
      ><button
        class="close-button"
        type="button"
        aria-label="Close navigation"
        (click)="closeMenu()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <nav class="nav-list">
      <span class="nav-caption">Workspace</span
      ><a routerLink="/assessment" routerLinkActive="active" (click)="closeMenu()"
        ><b
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 11 8-7 8 7v9h-6v-6h-4v6H4Z"></path></svg></b
        >Assessment Overview</a
      ><a routerLink="/tasks" routerLinkActive="active" (click)="closeMenu()"
        ><b
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 6h11M9 12h11M9 18h11"></path>
            <path d="m4 6 .8.8L6.5 5M4 12l.8.8 1.7-1.8M4 18l.8.8 1.7-1.8"></path></svg></b
        >Task Management</a
      >
    </nav>
    <div class="review-card">
      <span
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.25 19 6v5.2c0 4.45-2.8 7.78-7 9.55-4.2-1.77-7-5.1-7-9.55V6l7-2.75Z"></path>
          <path d="m9.25 12 1.8 1.8 3.8-4.05"></path></svg
      ></span>
      <div>
        <strong>Private review</strong><small>Access is limited to invited reviewers.</small>
      </div>
    </div>
    <div class="sidebar-profile">
      <span class="avatar">VT</span>
      <div><strong>Vishal Thombare</strong><small>Candidate</small></div>
      <button type="button" aria-label="Sign out" (click)="logout()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path>
        </svg>
      </button>
    </div>
  </aside>
  <section class="main-column">
    <header class="app-header">
      <div class="header-context">
        <button
          class="menu-button"
          type="button"
          aria-label="Open navigation"
          (click)="menuOpen.set(true)"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
        <div><span>Candidate portal</span><strong>Frontend assessment</strong></div>
      </div>
      <div class="header-actions">
        <a
          class="create-task-button"
          routerLink="/tasks"
          [queryParams]="{ create: 'true' }"
          aria-label="Create a new task"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
          <span>Create task</span>
        </a>
        <span class="secure-session">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3.25 19 6v5.2c0 4.45-2.8 7.78-7 9.55-4.2-1.77-7-5.1-7-9.55V6l7-2.75Z"
            ></path>
            <path d="m9.25 12 1.8 1.8 3.8-4.05"></path>
          </svg>
          Secure session
        </span>
        <div #profileMenu class="profile-menu">
          <button
            class="avatar avatar-button"
            type="button"
            aria-label="Open profile menu"
            aria-haspopup="menu"
            [attr.aria-expanded]="profileOpen()"
            (click)="profileOpen.set(!profileOpen())"
          >
            VT
          </button>
          @if (profileOpen()) {
            <div class="profile-popover" role="menu">
              <div><strong>Vishal Thombare</strong><span>Candidate</span></div>
              <button type="button" role="menuitem" (click)="logout()">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path>
                </svg>
                Sign out
              </button>
            </div>
          }
        </div>
      </div>
    </header>
    <main class="content"><router-outlet /></main>
  </section>
</div>
