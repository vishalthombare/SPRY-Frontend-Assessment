@if (open) {
  <aside class="toast toast--{{ type }}" role="status">
    <span class="toast-icon" aria-hidden="true">{{
      type === 'success' ? '✓' : type === 'error' ? '!' : 'i'
    }}</span>
    <div>
      <strong>{{ title }}</strong>
      @if (message) {
        <p>{{ message }}</p>
      }
    </div>
    <button type="button" aria-label="Dismiss notification" (click)="dismiss.emit()">×</button>
  </aside>
}
