<article class="task-row">
  <button class="check" type="button" [class.checked]="task.status === 'completed'" [attr.aria-label]="task.status === 'completed' ? 'Mark task incomplete' : 'Mark task complete'" (click)="toggleComplete.emit(task)">{{ task.status === 'completed' ? '✓' : '' }}</button>
  <div class="task-copy"><div class="task-title"><strong>{{ task.title }}</strong><span class="priority priority--{{ task.priority }}">{{ task.priority }}</span></div><p>{{ task.description }}</p><div class="meta"><span>{{ task.assignee }}</span><span>Due {{ task.dueDate }}</span></div></div>
  <div class="row-actions"><button type="button" aria-label="Edit task" (click)="edit.emit(task)">Edit</button><button class="remove" type="button" aria-label="Delete task" (click)="remove.emit(task)">Delete</button></div>
</article>
